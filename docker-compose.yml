services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_analyst}
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./03-database-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-analyst}:${POSTGRES_PASSWORD:-analyst}@postgres:5432/${POSTGRES_DB:-ai_analyst}
    depends_on:
      postgres:
        condition: service_healthy

  fastapi:
    build:
      context: .
      dockerfile: ai/analyst/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-analyst}:${POSTGRES_PASSWORD:-analyst}@postgres:5432/${POSTGRES_DB:-ai_analyst}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-1000}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.5}
      LLM_MAX_RETRY_AFTER_SECONDS: ${LLM_MAX_RETRY_AFTER_SECONDS:-60}
      LLM_EVAL_DELAY_SECONDS: ${LLM_EVAL_DELAY_SECONDS:-0}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-false}
      LLM_ROUTING_ENABLED: ${LLM_ROUTING_ENABLED:-false}
      LLM_ROUTING_DEFAULT_ROUTE: ${LLM_ROUTING_DEFAULT_ROUTE:-remote}
      LLM_ROUTING_ALLOW_REMOTE: ${LLM_ROUTING_ALLOW_REMOTE:-true}
      LLM_ROUTING_ALLOW_LOCAL: ${LLM_ROUTING_ALLOW_LOCAL:-true}
      LLM_ROUTING_FALLBACK_ENABLED: ${LLM_ROUTING_FALLBACK_ENABLED:-true}
      LLM_ROUTING_FALLBACK_ERROR_CODES: ${LLM_ROUTING_FALLBACK_ERROR_CODES:-LLM_TIMEOUT,LLM_CONNECTION_ERROR,LLM_RATE_LIMIT,LLM_SERVER_ERROR}
      LLM_ROUTING_MAX_ESTIMATED_COST_USD: ${LLM_ROUTING_MAX_ESTIMATED_COST_USD:-0}
      LLM_REMOTE_PROVIDER: ${LLM_REMOTE_PROVIDER:-openai-compatible}
      LLM_REMOTE_BASE_URL: ${LLM_REMOTE_BASE_URL:-}
      LLM_REMOTE_API_KEY: ${LLM_REMOTE_API_KEY:-}
      LLM_REMOTE_MODEL: ${LLM_REMOTE_MODEL:-}
      LLM_REMOTE_TIMEOUT_SECONDS: ${LLM_REMOTE_TIMEOUT_SECONDS:-60}
      LLM_REMOTE_MAX_RETRIES: ${LLM_REMOTE_MAX_RETRIES:-2}
      LLM_REMOTE_RETRY_BACKOFF_SECONDS: ${LLM_REMOTE_RETRY_BACKOFF_SECONDS:-0.5}
      LLM_REMOTE_MAX_RETRY_AFTER_SECONDS: ${LLM_REMOTE_MAX_RETRY_AFTER_SECONDS:-60}
      LLM_REMOTE_REASONING_EFFORT: ${LLM_REMOTE_REASONING_EFFORT:-low}
      LLM_REMOTE_DISABLE_THINKING: ${LLM_REMOTE_DISABLE_THINKING:-false}
      LLM_REMOTE_INPUT_COST_PER_1M: ${LLM_REMOTE_INPUT_COST_PER_1M:-0.075}
      LLM_REMOTE_OUTPUT_COST_PER_1M: ${LLM_REMOTE_OUTPUT_COST_PER_1M:-0.30}
      LLM_LOCAL_PROVIDER: ${LLM_LOCAL_PROVIDER:-openai-compatible}
      LLM_LOCAL_BASE_URL: ${LLM_LOCAL_BASE_URL:-http://host.docker.internal:11434}
      LLM_LOCAL_API_KEY: ${LLM_LOCAL_API_KEY:-ollama}
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-qwen3:8b}
      LLM_LOCAL_TIMEOUT_SECONDS: ${LLM_LOCAL_TIMEOUT_SECONDS:-120}
      LLM_LOCAL_MAX_RETRIES: ${LLM_LOCAL_MAX_RETRIES:-1}
      LLM_LOCAL_RETRY_BACKOFF_SECONDS: ${LLM_LOCAL_RETRY_BACKOFF_SECONDS:-0.5}
      LLM_LOCAL_MAX_RETRY_AFTER_SECONDS: ${LLM_LOCAL_MAX_RETRY_AFTER_SECONDS:-60}
      LLM_LOCAL_REASONING_EFFORT: ${LLM_LOCAL_REASONING_EFFORT:-}
      LLM_LOCAL_DISABLE_THINKING: ${LLM_LOCAL_DISABLE_THINKING:-true}
      LLM_LOCAL_INPUT_COST_PER_1M: ${LLM_LOCAL_INPUT_COST_PER_1M:-0}
      LLM_LOCAL_OUTPUT_COST_PER_1M: ${LLM_LOCAL_OUTPUT_COST_PER_1M:-0}
      LLM_INPUT_COST_PER_1M: ${LLM_INPUT_COST_PER_1M:-0}
      LLM_OUTPUT_COST_PER_1M: ${LLM_OUTPUT_COST_PER_1M:-0}
      VALUE_GROUNDING_MAX_VALUES: ${VALUE_GROUNDING_MAX_VALUES:-20}
      EVALUATION_RUN_LABEL: ${EVALUATION_RUN_LABEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${FASTAPI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      etl:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: backend/springboot/Dockerfile
    environment:
      FASTAPI_BASE_URL: http://fastapi:8000
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres_data:

