spring:
  application:
    name: ai-data-analyst-gateway

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://fastapi:8000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
