name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          enable-cache: false

      - name: Prepare deterministic local environment
        run: cp .env.example .env

      - name: Check repository publication hygiene
        run: make repo-check

      - name: Run deterministic production baseline
        run: make verify

      - name: Show Compose state on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200

      - name: Clean up Compose resources
        if: always()
        run: docker compose down -v --remove-orphans
